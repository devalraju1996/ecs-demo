version: 0.2

# Backend build: builds the backend image, pushes it to ECR,
# and writes imagedefinitions.json for the ECS deploy action.
#
# In the CodeBuild project, set Buildspec name to: backend/buildspec.yml
# Commands run from the repo root, so the Docker build context is ./backend
# CodeBuild project needs "Privileged" mode enabled for Docker builds.

env:
  variables:
    AWS_ACCOUNT_ID: "700017004782"
    REPO_NAME: "backend"
    # Must match the container name in the backend ECS task definition
    CONTAINER_NAME: "backend"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - REPOSITORY_URI=$ECR_REGISTRY/$REPO_NAME
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${IMAGE_TAG:=latest}
      - echo "Image tag is $IMAGE_TAG"

  build:
    commands:
      - echo "Building backend image..."
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:latest ./backend

  post_build:
    commands:
      - echo "Pushing backend image to ECR..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest
      - echo "Writing imagedefinitions.json..."
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
