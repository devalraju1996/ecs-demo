version: 0.2

# Builds the frontend and backend images, pushes them to ECR,
# and writes one imagedefinitions file per ECS service for CodePipeline.
#
# Expected repo layout:
#   backend/  -> Dockerfile, package.json, server.js
#   frontend/ -> Dockerfile, package.json, server.js
#
# Set these as CodeBuild environment variables (or override here):
#   AWS_ACCOUNT_ID, AWS_DEFAULT_REGION (set automatically by CodeBuild)
# CodeBuild project needs "Privileged" mode enabled for Docker builds.

env:
  variables:
    FRONTEND_REPO: "ecs-demo-frontend"
    BACKEND_REPO: "ecs-demo-backend"
    # Must match the container names in each ECS task definition
    FRONTEND_CONTAINER: "frontend"
    BACKEND_CONTAINER: "backend"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${IMAGE_TAG:=latest}
      - FRONTEND_URI=$ECR_REGISTRY/$FRONTEND_REPO
      - BACKEND_URI=$ECR_REGISTRY/$BACKEND_REPO
      - echo "Image tag is $IMAGE_TAG"

  build:
    commands:
      - echo "Building backend image..."
      - docker build -t $BACKEND_URI:$IMAGE_TAG -t $BACKEND_URI:latest ./backend
      - echo "Building frontend image..."
      - docker build -t $FRONTEND_URI:$IMAGE_TAG -t $FRONTEND_URI:latest ./frontend

  post_build:
    commands:
      - echo "Pushing images to ECR..."
      - docker push $BACKEND_URI:$IMAGE_TAG
      - docker push $BACKEND_URI:latest
      - docker push $FRONTEND_URI:$IMAGE_TAG
      - docker push $FRONTEND_URI:latest
      - echo "Writing image definitions files..."
      - printf '[{"name":"%s","imageUri":"%s"}]' $BACKEND_CONTAINER $BACKEND_URI:$IMAGE_TAG > backend-imagedefinitions.json
      - printf '[{"name":"%s","imageUri":"%s"}]' $FRONTEND_CONTAINER $FRONTEND_URI:$IMAGE_TAG > frontend-imagedefinitions.json
      - cat backend-imagedefinitions.json frontend-imagedefinitions.json

artifacts:
  files:
    - backend-imagedefinitions.json
    - frontend-imagedefinitions.json
